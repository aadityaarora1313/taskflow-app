<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #f6f7fb; font-family: system-ui, sans-serif; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #64748b; font-size: 14px; }
  #loader .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,#6366f1,#8b5cf6); display: flex; align-items: center; justify-content: center; }
  #offline { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: #f6f7fb; color: #0f172a; text-align: center; padding: 24px; }
  #offline button { padding: 10px 18px; border: 0; border-radius: 10px; background: #6366f1; color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div id="loader"><div class="logo"><svg width="28" height="28" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>Loading TaskFlow…</div>
  <div id="offline"><b>You're offline</b><span>TaskFlow needs an internet connection.</span><button onclick="location.reload()">Retry</button></div>
  <iframe id="app" allow="camera; microphone; clipboard-write" allowfullscreen></iframe>
<script>
  // >>> YAHAN APNA APPS SCRIPT WEB APP URL DAALO (jo /exec par khatam hota hai) <<<
  const APP_URL = 'https://script.google.com/macros/s/AKfycbz1sEkPRDph5N_mciKLKOJ8hmaZ3xF9Tz68GPUdMg9AJWFAJcuH3joNmj4G8aTIHHZg/exec';

  const f = document.getElementById('app');
  const show = () => { document.getElementById('loader').style.display = 'none'; };
  f.onload = show; setTimeout(show, 6000);
  if (navigator.onLine) f.src = APP_URL; else document.getElementById('offline').style.display = 'flex';
  window.addEventListener('online', () => { document.getElementById('offline').style.display = 'none'; if (!f.src) f.src = APP_URL; });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
